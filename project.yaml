# MICU AI 资源库项目元数据
# 用于 zuoliangyu/micu-ai-lib 聚合展示。

name: SolidWorks Automation Skill
authors: [wzyn20051216, zuoliangyu]
category: Tool
tags: [SolidWorks, CAD, AutoCAD, Desktop, Tauri, React, MCP, Python, COM, Automation, VibeCAD, Subskills]
status: in-progress
updated: 2026-10-27
summary: 面向 Codex、Claude 与 OpenClaw 的 SolidWorks 自动化技能总仓，以 Skill + MCP 为主产品，支持零件建模、装配、工程图、导出、自审查与本地工具调用；CAD Studio 是可选、独立版本的 Tauri + React 桌面 GUI。

cover: assets/douyin-balance.jpg
readme: README.md

links:
  github: https://github.com/wzyn20051216/solidworks-automation-skill

subskills:
  - name: solidworks-vibecad
    status: experimental
    path: subskills/solidworks-vibecad
    summary: 自然语言需求到参数化设计计划、制造规则检查、执行摘要和审查门禁。
  - name: solidworks-fillet-chamfer-cnc
    status: stable
    path: subskills/solidworks-fillet-chamfer-cnc
    summary: CNC 安装座、参数/碰撞预检、语义选边、有界尺寸降级、孔槽和圆角口袋。
  - name: solidworks-threaded-holes
    status: stable
    path: subskills/solidworks-threaded-holes
    summary: M3-M12 螺纹孔、攻丝底孔、孔口倒角、螺纹属性和 STEP 输出。
  - name: solidworks-engineering-drawing
    status: pilot
    path: subskills/solidworks-engineering-drawing
    summary: GB/T 第一角零件图/装配图、尺寸链、孔表、BOM、PDF/BMP 证据和制造交付审视。
  - name: autocad-automation
    status: stable
    path: subskills/autocad-automation
    summary: AutoCAD DWG/DXF 二维绘图、线稿矢量化、图层/文字/标注处理、导出和图纸自检。
