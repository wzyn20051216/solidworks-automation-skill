name: Update star history chart

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate light and dark charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_star_history.py

      - name: Commit updated charts
        shell: bash
        run: |
          if git diff --quiet -- assets/star-history.svg assets/star-history-dark.svg; then
            echo "Star history is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg assets/star-history-dark.svg
          git commit -m "更新星标趋势图"
          git push
