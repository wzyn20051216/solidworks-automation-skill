name: Skill + MCP Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  governance:
    name: governance-gate
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check governance gate integrity
        run: |
          node --test tests/test_cad_ci_guard.cjs
          node scripts/ci/check_governance_drift.cjs

  python_tests:
    name: python-tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install pytest -r requirements.txt -r mcp-server/requirements.txt
      - name: Validate core release metadata
        run: python scripts/release_check.py --core-only
      - name: Run Python tests
        run: python -m pytest -q
      - name: Validate Skill
        run: python scripts/validate_skill.py
      - name: Validate MCP protocol
        run: python scripts/validate_mcp.py

  core_package:
    name: core-package
    needs: [governance, python_tests]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install packaging dependencies
        run: python -m pip install -r requirements.txt -r mcp-server/requirements.txt
      - name: Build Skill and MCP bundles
        run: powershell -File scripts/build_core_release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: solidworks-skill-mcp
          path: release-output/*
          if-no-files-found: error

  test_and_build:
    name: test-and-build
    needs: [governance, python_tests, core_package]
    if: always()
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Verify every prerequisite job succeeded
        shell: pwsh
        env:
          RESULT_GOVERNANCE: ${{ needs.governance.result }}
          RESULT_PYTHON: ${{ needs.python_tests.result }}
          RESULT_CORE: ${{ needs.core_package.result }}
        run: |
          $checks = @(
            "governance=$env:RESULT_GOVERNANCE"
            "python-tests=$env:RESULT_PYTHON"
            "core-package=$env:RESULT_CORE"
          )
          $notPassed = @()
          foreach ($check in $checks) {
            $parts = $check -split "=", 2
            Write-Output ("{0,-16} {1}" -f $parts[0], $parts[1])
            if ($parts[1] -ne "success") { $notPassed += $parts[0] }
          }
          if ($notPassed.Count -gt 0) {
            throw ("必需作业未全部成功: {0}" -f ($notPassed -join ", "))
          }
          Write-Output "Skill + MCP 主产品门禁通过。"

  publish_release:
    name: publish-skill-mcp-release
    needs: [test_and_build]
    if: startsWith(github.ref, 'refs/tags/v') && needs.test_and_build.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          name: solidworks-skill-mcp
          path: release-output
      - name: Prepare core product release draft
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }} - SolidWorks Skill + MCP
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-output/SolidWorks-Automation-Skill-*.zip
            release-output/*.mcpb
            release-output/SHA256SUMS.txt
