# 真实 CAD 回归（手动触发，**不是**必需合并检查）
#
# 合并门禁只由 skill-mcp-release.yml 的 `test-and-build`（GitHub 托管 windows-2022）承担。
# 本工作流需要一台装有 SolidWorks 的自托管 Runner，仓库当前 Runner 数为 0，因而无法被调度；
# 它既不阻止合并，也不产生任何远端 CAD 证据。不要把它写成"远程 CAD CI 已通过"。
#
# 若未来登记 Runner 并希望将其升级为门禁，必须先补齐 cad-validation Environment 与只读审计令牌，
# 并单独评估"自托管 Runner 会执行工作流中的任意代码"这一风险后再改 ruleset。
name: Windows CAD Regression

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "审批人可复核的真机运行原因"
        required: true
      golden_case:
        description: "Golden 用例。单次只跑一个，避免多用例 matrix 撞上 45 分钟超时"
        type: choice
        default: mounting_bracket
        options:
          - mounting_bracket
          - parallel_gripper_assembly
          - parallel_gripper_retention_travel
      runs:
        description: "独立运行轮数。5 = 正式验收（预期终态 blocked）；1-4 = 冒烟（预期终态 completed，非正式证据）"
        type: choice
        default: "5"
        options:
          - "5"
          - "3"
          - "2"
          - "1"
      run_legacy_regressions:
        description: "同时执行旧版 SolidWorks/AutoCAD 回归（需另装 AutoCAD）"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # 统一父子 Python 进程编码，避免 Windows CLI 子进程 GBK/UTF-8 不一致。
  PYTHONUTF8: "1"

concurrency:
  group: controlled-windows-cad
  cancel-in-progress: false

jobs:
  authorize:
    # 先在托管机只读核验；Environment 不存在或保护不足时不分配自托管 Runner。
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'wzyn20051216/solidworks-automation-skill' &&
      github.ref_type == 'branch' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      authorized: ${{ steps.guard.outputs.authorized }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorization policy fault injection
        run: node --test tests/test_cad_ci_guard.cjs
      - name: Read protected branch, actors, Environment and Runner state
        id: guard
        run: node scripts/ci/cad_ci_guard.cjs
        env:
          # GITHUB_TOKEN 不提供 Administration:read；需人工配置仅选定仓库的只读审计凭据。
          GH_TOKEN: ${{ secrets.CAD_CI_AUDIT_TOKEN }}
      - name: Upload admission audit (not CAD evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cad-ci-admission
          path: cad-ci-admission.json

  cad-regression:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    environment: cad-validation
    # 需要预装 SolidWorks/AutoCAD 的 Windows 自托管测试机。
    runs-on: [self-hosted, Windows, CAD]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cad-source-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require a fresh owned checkout directory
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if (Test-Path -LiteralPath "cad-source-${{ github.run_id }}-${{ github.run_attempt }}") {
            throw "BLOCKED: checkout directory already exists; preserving files"
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: cad-source-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Full offline regression (no CAD launch)
        run: python -X utf8 -m pytest -q
      - name: Deterministic mock eval (separate from real CAD evidence)
        run: python tests/evals/runner.py --output-dir "output/p0-offline-eval-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Environment doctor
        if: inputs.run_legacy_regressions
        run: python scripts/cad_doctor.py
      - name: Lifecycle stability simulation
        run: python scripts/stability_regression.py
      - name: SolidWorks week 3 real regression
        if: inputs.run_legacy_regressions
        run: python tests/solidworks_week3_delivery_regression.py
        env:
          CAD_STUDIO_VISIBLE: "false"
      - name: SolidWorks week 4 drawing and BOM regression
        if: inputs.run_legacy_regressions
        run: python tests/solidworks_week4_drawing_regression.py
        env:
          CAD_STUDIO_VISIBLE: "false"
      - name: AutoCAD week 4 real regression
        if: inputs.run_legacy_regressions
        run: python tests/autocad_week4_drawing_regression.py
        env:
          CAD_STUDIO_VISIBLE: "false"
      - name: AutoCAD backend preflight
        if: inputs.run_legacy_regressions
        run: python subskills/autocad-automation/scripts/acad_dotnet_preflight.py
      - name: SolidWorks 2026 Golden — formal acceptance (five independent runs)
        if: inputs.runs == '5'
        shell: pwsh
        run: >-
          python -X utf8 tests/solidworks_golden_workflow.py
          --case "${{ inputs.golden_case }}"
          --output "output/p0-golden-${{ inputs.golden_case }}-${{ github.run_id }}-${{ github.run_attempt }}"
          --runs 5 --expected-terminal blocked
      # @brief 冒烟模式：轮数不足 5 时无法满足 blocked 终态的语义（harness 会拒绝），
      #        故只断言"能跑到 completed"。此模式**不产生正式验收证据**。
      - name: SolidWorks 2026 Golden — smoke run (NOT formal acceptance)
        if: inputs.runs != '5'
        shell: pwsh
        run: >-
          python -X utf8 tests/solidworks_golden_workflow.py
          --case "${{ inputs.golden_case }}"
          --output "output/p0-golden-smoke-${{ inputs.golden_case }}-${{ github.run_id }}-${{ github.run_attempt }}"
          --runs "${{ inputs.runs }}" --expected-terminal completed
      - name: Upload CAD regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cad-regression-evidence
          if-no-files-found: ignore
          path: |
            cad-source-${{ github.run_id }}-${{ github.run_attempt }}/output/**
            cad-source-${{ github.run_id }}-${{ github.run_attempt }}/tests/output/**
            cad-source-${{ github.run_id }}-${{ github.run_attempt }}/cad-studio-diagnostics.zip
