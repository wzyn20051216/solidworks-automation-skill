name: Windows Release Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # @brief merge queue 必须在 merge_group 上报告必需检查，否则队列条目等不到检查而超时。
  #        该事件由 ruleset 的 merge_queue 规则触发，ref 形如 refs/heads/gh-readonly-queue/...。
  merge_group:
  workflow_dispatch:

# @brief 同一 PR 只保留最新一次运行：旧提交的运行被取消，反馈更快且不浪费额度。
#        main 推送与队列条目不互相取消，避免把真实发布验证打断。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# @brief 默认最小权限；仅发布作业需要写权限（发布 Release 时由 job 级覆盖）。
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 治理门禁
  governance:
    name: governance-gate
    # @brief 固定已验证的桌面验收环境，避免 windows-latest 的 Server 2025/WebView2 回归。
    # 上游跟踪：https://github.com/actions/runner-images/issues/14738
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # @brief 治理门禁自检。本作业是 test-and-build 的必需前置，因此这两项仍在必需门禁之内：
      #        若把它们移出必需门禁，一个削弱 guard 的 PR 可以通过必需状态检查正常合并，
      #        准入判定随即失去意义。注意本步骤只能检测漂移，不能阻止有合并权者一并修改这些文件。
      - name: Check governance gate integrity
        run: |
          node --test tests/test_cad_ci_guard.cjs
          node scripts/ci/check_governance_drift.cjs

  # ---------------------------------------------------------------- Python 侧
  python_tests:
    name: python-tests
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python test dependencies
        run: python -m pip install pytest -r requirements.txt -r mcp-server/requirements.txt
      - name: Verify Python runtime contracts
        run: python -c "import ezdxf; from mcp.server.fastmcp import FastMCP; print('ezdxf and MCP runtime imports passed')"
      - name: Generate bundled desktop skill
        run: python scripts/sync_bundled_skill.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Validate skill
        run: python scripts/validate_skill.py
      - name: Validate MCP protocol
        run: python scripts/validate_mcp.py
      - name: Check release contracts
        run: python scripts/release_check.py

  # ---------------------------------------------------------------- 前端侧
  frontend_tests:
    name: frontend-tests
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/workbench-ui/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/workbench-ui
        run: npm ci
      - name: Test package startup diagnostics
        run: node --test tests/test_release_portable_wait.cjs
      # @brief 安装器安全边界（拒绝覆盖用户目录、不凭空创建、非 Windows 拒绝）必须随测试守住。
      - name: Test skill installer safety
        run: node --test tests/test_install_safety.cjs
      - name: Test frontend
        working-directory: apps/workbench-ui
        run: npm test
      - name: Build frontend
        working-directory: apps/workbench-ui
        run: npm run build

  # ---------------------------------------------------------------- Rust 侧
  rust_tests:
    name: rust-tests
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/workbench-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      # @brief tauri 构建脚本读取 frontendDist（../dist）；先构建前端，保证 cargo 侧有产物。
      - name: Install frontend dependencies
        working-directory: apps/workbench-ui
        run: npm ci
      - name: Build frontend for tauri context
        working-directory: apps/workbench-ui
        run: npm run build
      - name: Check Rust formatting
        working-directory: apps/workbench-ui/src-tauri
        run: cargo fmt -- --check
      - name: Test Rust backend
        working-directory: apps/workbench-ui/src-tauri
        run: cargo test
      - name: Lint Rust backend
        working-directory: apps/workbench-ui/src-tauri
        run: cargo clippy -- -D warnings

  # ---------------------------------------------------------------- 打包与端到端
  package_build:
    name: package-build
    # @brief 先确认静态检查与单测通过，再花时间打包，避免把额度浪费在已知会失败的提交上。
    needs: [governance, python_tests, frontend_tests]
    runs-on: windows-2022
    timeout-minutes: 45
    # 打包只读仓库；Release 写权限仅授予完整门禁之后的发布作业。
    permissions:
      contents: read
    env:
      # @brief 端到端步骤单次上限，配合下方的一次重试，避免悬挂直到作业超时。
      CAD_E2E_TIMEOUT_MINUTES: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/workbench-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: Install frontend dependencies
        working-directory: apps/workbench-ui
        run: npm ci
      - name: Configure updater signing key
        working-directory: apps/workbench-ui
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASE_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $signingKey = $env:RELEASE_SIGNING_KEY
          $signingPassword = $env:RELEASE_SIGNING_KEY_PASSWORD
          if ([string]::IsNullOrWhiteSpace($signingKey)) {
            if ("${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true") {
              throw "TAURI_SIGNING_PRIVATE_KEY is required for a public release tag."
            }
            $temporaryKey = Join-Path $env:RUNNER_TEMP "cad-studio-ci-updater.key"
            $passwordBytes = New-Object byte[] 32
            [System.Security.Cryptography.RandomNumberGenerator]::Fill($passwordBytes)
            $signingPassword = [Convert]::ToBase64String($passwordBytes)
            Write-Output "::add-mask::$signingPassword"
            # @brief CLI 会打印临时私钥；生成输出只在失败时报告固定错误，避免进入日志。
            $generatedKeyOutput = npx tauri signer generate --password $signingPassword --write-keys $temporaryKey --ci 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Cannot generate temporary updater signing key." }
            $signingKey = Get-Content -LiteralPath $temporaryKey -Raw
            # @brief fork 无生产密钥时，测试包与验签必须使用同一临时公钥；不修改仓库中的生产配置。
            $temporaryPublicKey = (Get-Content -LiteralPath "$temporaryKey.pub" -Raw).Trim()
            if ([string]::IsNullOrWhiteSpace($temporaryPublicKey)) { throw "Temporary updater public key is missing." }
            $configPath = Join-Path $PWD "src-tauri/tauri.conf.json"
            $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
            $config.plugins.updater.pubkey = $temporaryPublicKey
            [System.IO.File]::WriteAllText($configPath, ($config | ConvertTo-Json -Depth 100), (New-Object System.Text.UTF8Encoding($false)))
          }
          if ([string]::IsNullOrWhiteSpace($signingPassword)) { throw "Updater signing key password is missing." }
          foreach ($keyLine in ($signingKey -split "`r?`n")) {
            if (-not [string]::IsNullOrWhiteSpace($keyLine)) { Write-Output "::add-mask::$keyLine" }
          }
          Write-Output "::add-mask::$signingPassword"
          "TAURI_SIGNING_PRIVATE_KEY<<CAD_STUDIO_SIGNING_KEY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $signingKey | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAD_STUDIO_SIGNING_KEY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$signingPassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build release packages
        run: powershell -File scripts/build_windows_release.ps1
      - name: Verify updater release contract
        run: powershell -File scripts/verify_updater_release.ps1
      - name: Install Playwright browser
        working-directory: apps/workbench-ui
        run: npx playwright install chromium
      # @brief 端到端只允许"重试 1 次"，且必须保留第 1 次诊断：
      #        重试用于吸收 WebView2/CDP 启动竞态，不允许把稳定失败掩盖成偶发。
      - name: Test portable package
        shell: pwsh
        timeout-minutes: 20
        run: |
          node ai_team/release-portable-e2e.cjs
          if ($LASTEXITCODE -eq 0) { exit 0 }
          Write-Output "::warning::便携版 E2E 第 1 次失败（exit $LASTEXITCODE）；保留第 1 次诊断后重试 1 次。"
          foreach ($name in @("e2e-diagnostics.json", "e2e-diagnostics.log")) {
            $source = Join-Path "release-output" $name
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path "release-output" ($name -replace "e2e-diagnostics", "e2e-diagnostics.attempt1")) -Force
            }
          }
          node ai_team/release-portable-e2e.cjs
          if ($LASTEXITCODE -ne 0) { throw "便携版 E2E 重试后仍失败（exit $LASTEXITCODE）。" }
      - name: Test installer package
        shell: pwsh
        timeout-minutes: 20
        run: |
          powershell -NoProfile -File ai_team/nsis-install-e2e.ps1
          if ($LASTEXITCODE -eq 0) { exit 0 }
          Write-Output "::warning::安装包 E2E 第 1 次失败（exit $LASTEXITCODE）；重试 1 次。"
          powershell -NoProfile -File ai_team/nsis-install-e2e.ps1
          if ($LASTEXITCODE -ne 0) { throw "安装包 E2E 重试后仍失败（exit $LASTEXITCODE）。" }
      # @brief 诊断必须无条件上传，否则失败时恰好拿不到现场。
      - name: Upload package startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cad-studio-package-diagnostics
          path: release-output/e2e-diagnostics.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: cad-studio-windows-x64
          path: release-output/*
  # ---------------------------------------------------------------- 必需状态检查
  # @brief 该作业的显示名就是 ruleset 里要求的必需检查上下文 test-and-build；改名会直接让门禁失效。
  #        作业 id 用下划线是刻意的：GitHub 表达式里 needs.python-tests.result 会被解析成减法，
  #        只有 needs.python_tests.result 这种标识符才能正确取值。
  #        拆分后它必须真实反映所有前置作业：失败时给出 failure 而不是 skipped，
  #        避免"没有运行"被误读为"通过"或"无关"。
  test_and_build:
    name: test-and-build
    needs: [governance, python_tests, frontend_tests, rust_tests, package_build]
    if: always()
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Verify every prerequisite job succeeded
        shell: pwsh
        env:
          RESULT_GOVERNANCE: ${{ needs.governance.result }}
          RESULT_PYTHON: ${{ needs.python_tests.result }}
          RESULT_FRONTEND: ${{ needs.frontend_tests.result }}
          RESULT_RUST: ${{ needs.rust_tests.result }}
          RESULT_PACKAGE: ${{ needs.package_build.result }}
        run: |
          # @brief 用数组而不是哈希表：作业名含连字符，未加引号的哈希键会让 PowerShell 解析失败。
          $checks = @(
            "governance=$env:RESULT_GOVERNANCE"
            "python-tests=$env:RESULT_PYTHON"
            "frontend-tests=$env:RESULT_FRONTEND"
            "rust-tests=$env:RESULT_RUST"
            "package-build=$env:RESULT_PACKAGE"
          )
          $notPassed = @()
          foreach ($check in $checks) {
            $parts = $check -split "=", 2
            Write-Output ("{0,-16} {1}" -f $parts[0], $parts[1])
            if ($parts[1] -ne "success") { $notPassed += $parts[0] }
          }
          if ($notPassed.Count -gt 0) {
            throw ("必需作业未全部成功: {0}" -f ($notPassed -join ", "))
          }
          Write-Output "所有必需作业均成功。"

  # 发布必须在全部验证成功之后；先生成草稿，回读附件及签名后再公开。
  publish_release:
    name: publish-release-draft
    needs: [test_and_build]
    if: startsWith(github.ref, 'refs/tags/v') && needs.test_and_build.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          name: cad-studio-windows-x64
          path: release-output
      - name: Prepare verified release draft
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }} — SolidWorks Skill + CAD Studio
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-output/SolidWorks-Automation-Skill-*.zip
            release-output/CAD-Studio-*-Setup-x64.exe
            release-output/CAD-Studio-*-Setup-x64.exe.sig
            release-output/CAD-Studio-*-Portable.zip
            release-output/latest.json
            release-output/SHA256SUMS.txt
